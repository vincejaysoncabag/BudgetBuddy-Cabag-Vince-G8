{% extends "base.html" %}
{% block title %}Change password · BudgetBuddy{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Change password</h1>
  <p class="sub">Enter your current password first.</p>
  <form method="post" novalidate>{% csrf_token %}
    {% include "accounts/_form.html" %}
    <button class="btn" type="submit">Change password</button>
  </form>
  <p><a href="{% url 'profile' %}">Back to profile</a></p>
</div>
{% endblock %}
