{% extends "base.html" %}
{% block title %}Create account · BudgetBuddy{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Create your account</h1>
  <p class="sub">Track your spending in one place.</p>
  <form method="post" novalidate>{% csrf_token %}
    {% include "accounts/_form.html" %}
    <button class="btn" type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
