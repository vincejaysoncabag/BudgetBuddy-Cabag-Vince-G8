{% for e in form.non_field_errors %}<p class="err">{{ e }}</p>{% endfor %}
{% for field in form %}
<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}
  {% for e in field.errors %}<p class="err">{{ e }}</p>{% endfor %}
</div>
{% endfor %}
